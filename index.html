<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>公倍数ステップ★アドベンチャー</title>
  <link rel="stylesheet" href="style.css">
  <!-- ポップなフォントの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-container">
    <!-- 紙吹雪用キャンバス -->
    <canvas id="confetti-canvas"></canvas>

    <!-- サウンド切替ボタン -->
    <button id="btn-sound-toggle" class="sound-toggle" aria-label="音の切り替え">🔊</button>

    <!-- タイトル画面 -->
    <div id="screen-title" class="screen active">
      <div class="title-badge">★ しょうがく5ねんせい さんすう ★</div>
      <h1 class="game-title">公倍数ステップ<span class="title-sub">★アドベンチャー</span></h1>
      <div class="character-preview">
        <div class="mascot jumping">🚀</div>
      </div>
      <p class="subtitle">さいしょう公倍数を見つけて、ステップをかけのぼろう！</p>
      <div class="title-buttons">
        <button id="btn-start" class="btn-primary btn-pulse">▶ ゲームスタート！</button>
        <button id="btn-ranking-view" class="btn-secondary">🏆 ランキング</button>
      </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="screen-game" class="screen">
      <!-- ヘッダー情報 -->
      <div class="header">
        <div class="header-left">
          <div class="time-box">
            <span class="label">のこり時間</span>
            <span id="time-left" class="value">90</span><span class="unit">秒</span>
          </div>
        </div>
        <div class="header-center">
          <!-- フィーバーゲージ -->
          <div class="fever-container">
            <div class="fever-label">⚡ FEVER GAUGE</div>
            <div class="fever-bar-bg">
              <div id="fever-bar" class="fever-bar-fill" style="width: 0%;"></div>
            </div>
          </div>
        </div>
        <div class="header-right">
          <div class="score-box">
            <span class="label">スコア</span>
            <span id="score" class="value">0</span>
          </div>
        </div>
      </div>

      <!-- コンボ通知 -->
      <div id="combo-badge" class="combo-badge hidden">🔥 <span id="combo-count">2</span> COMBO!</div>

      <!-- メイン出題エリア -->
      <div class="main-area">
        <div class="problem-area">
          <div class="question-banner">
            <span class="q-icon">🎯</span>
            <h2 id="current-question"><span class="q-num">?</span> と <span class="q-num">?</span> の公倍数</h2>
          </div>

          <!-- ステップ（階段状のカード） -->
          <div class="step-indicator">
            <div class="step-card" id="step-0">
              <div class="step-badge">1st</div>
              <div class="step-title">最小公倍数</div>
              <div class="ans-slot" id="ans-0">?</div>
            </div>
            <div class="step-card" id="step-1">
              <div class="step-badge">2nd</div>
              <div class="step-title">2番目</div>
              <div class="ans-slot" id="ans-1">?</div>
            </div>
            <div class="step-card" id="step-2">
              <div class="step-badge">3rd</div>
              <div class="step-title">3番目</div>
              <div class="ans-slot" id="ans-2">?</div>
            </div>
          </div>

          <!-- 入力・フィードバック -->
          <div class="answer-interactive">
            <div class="input-display" id="input-display">_</div>
            <div class="feedback" id="feedback-msg"></div>
          </div>
        </div>
      </div>

      <!-- テンキーエリア -->
      <div class="numpad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
        <button class="func-btn btn-clear" id="btn-clear">クリア ✕</button>
        <button class="num-btn" data-num="0">0</button>
        <button class="func-btn btn-submit" id="btn-submit">けってい ✔</button>
      </div>
    </div>

    <!-- リザルト画面 -->
    <div id="screen-result" class="screen">
      <div class="result-card">
        <div class="result-header">
          <div id="result-stars" class="result-stars">★★★</div>
          <h2 class="result-title">タイムアップ！</h2>
          <div id="result-rank" class="result-rank">称号: 公倍数マスター</div>
        </div>
        
        <div class="result-stats-grid">
          <div class="stat-item">
            <div class="stat-label">トータルスコア</div>
            <div class="stat-val" id="final-score">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">クリアした問題</div>
            <div class="stat-val"><span id="final-correct">0</span> <span class="unit">問</span></div>
          </div>
          <div class="stat-item">
            <div class="stat-label">最大コンボ</div>
            <div class="stat-val"><span id="final-max-combo">0</span> <span class="unit">連続</span></div>
          </div>
        </div>

        <div id="ranking-form-area" class="ranking-form">
          <p class="form-title">🏆 ランキングにきろくを残そう！</p>
          <div class="input-row">
            <input type="text" id="nickname" placeholder="ニックネーム (12文字まで)" maxlength="12">
            <button id="btn-register" class="btn-primary">登録する</button>
          </div>
          <div id="register-msg" class="register-msg"></div>
        </div>

        <div class="result-actions">
          <button id="btn-retry" class="btn-primary">🔄 もう一度あそぶ</button>
          <button id="btn-back-title" class="btn-secondary">🏠 タイトルへ</button>
        </div>
      </div>
    </div>

    <!-- ランキング画面 -->
    <div id="screen-ranking" class="screen">
      <div class="ranking-container">
        <h2>🏆 殿堂入りランキング Top 20</h2>
        <div id="ranking-list" class="ranking-list">
          <p class="loading-text">ランキングを読み込み中...</p>
        </div>
        <button id="btn-ranking-close" class="btn-secondary">🏠 タイトルへもどる</button>
      </div>
    </div>
  </div>

  <script src="sound.js"></script>
  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
